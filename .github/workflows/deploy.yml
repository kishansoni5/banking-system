name: CI/CD Pipeline

on:
  push:
    branches:
      - main  # 👈 Triggers the automation every time you push to the main branch

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the fresh code into the GitHub Runner environment
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step 2: Install Java 17 (Change to '21' if your project uses Java 21)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven' # Caches dependencies so future builds run much faster

      # Step 3: Grant execute permission to the Maven wrapper script
      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      # Step 4: Build your clean Spring Boot JAR file (Skipping test compilation)
      - name: Build Application JAR
        run: ./mvnw clean package -DskipTests

      # Step 5: Log into your Docker Hub account securely using GitHub Secrets
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # Step 6: Build and Push the brand-new Docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: kishansoni3/banking:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # 👈 This ensures deployment only runs if the build completely succeeds

    steps:
      # Step 7: SSH securely into AWS EC2 and execute the container refresh sequence
      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu # Change to 'ec2-user' if you are using an Amazon Linux AMI instead of Ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/Banking-app
            docker-compose pull
            docker-compose up -d
